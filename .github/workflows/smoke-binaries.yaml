name: smoke binaries

# Cross-compile every release target on one machine (as releases do), then run
# each artifact on its NATIVE OS runner with the minimal smoke test. Validates
# that the cross-built binaries actually run, not just that they compiled.
#
# Dispatch-only on purpose: this verifies a property of the Bun toolchain + deps
# (does the binary run on OS X), which changes rarely, so it is not worth gating
# every release on. Run it before the first release, and after a Bun bump or any
# platform-sensitive change:
#   gh workflow run smoke-binaries --repo michaeldlfx/suiseki
#
# Not smoke-tested but still built and shipped: darwin-x64 (the hosted Intel
# macOS runner is retired). musl and Windows are not supported.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: cross-compile all targets
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install dependencies
        run: make install-frozen

      - name: build release binaries
        run: make release

      - name: upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  smoke:
    name: smoke ${{ matrix.name }}
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: darwin-arm64
            runner: macos-14
            asset: suiseki-darwin-arm64
          - name: linux-x64
            runner: ubuntu-latest
            asset: suiseki-linux-x64
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            asset: suiseki-linux-arm64
    steps:
      - name: download binaries
        uses: actions/download-artifact@v8
        with:
          name: dist

      - name: smoke test
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          chmod +x "$ASSET" || true

          echo "--- --version ---"
          "./$ASSET" --version | grep -q '^suiseki '

          echo "--- --help ---"
          "./$ASSET" --help | grep -q 'Usage:'

          echo "--- stdin diff ---"
          printf 'diff --git a/x b/x\nindex 0000000..1111111 100644\n--- a/x\n+++ b/x\n@@ -1 +1 @@\n-old\n+new\n' \
            | "./$ASSET" --no-pager --no-color | grep -q 'new'

          echo "ok: $ASSET"

name: smoke binaries

# Cross-compile every release target on one machine (as releases do), then run
# each artifact on its NATIVE OS runner with the minimal smoke test. Validates
# that the cross-built binaries actually run, not just that they compiled.
#
# Dispatch-only on purpose: this verifies a property of the Bun toolchain + deps
# (does the binary run on OS X), which changes rarely, so it is not worth gating
# every release on. Run it before the first release, and after a Bun bump or any
# platform-sensitive change:
#   gh workflow run smoke-binaries --repo michaeldlfx/suiseki
#
# windows-arm64 is built but not smoke-tested: GitHub has no hosted arm64 Windows
# runner.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: cross-compile all targets
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install dependencies
        run: make install-frozen

      - name: build release binaries
        run: make release

      - name: upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  smoke:
    name: smoke ${{ matrix.name }}
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: darwin-arm64
            runner: macos-14
            asset: suiseki-darwin-arm64
          - name: darwin-x64
            runner: macos-13
            asset: suiseki-darwin-x64
          - name: linux-x64
            runner: ubuntu-latest
            asset: suiseki-linux-x64
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            asset: suiseki-linux-arm64
          - name: linux-x64-musl
            runner: ubuntu-latest
            asset: suiseki-linux-x64-musl
            container: alpine:3
          - name: linux-arm64-musl
            runner: ubuntu-24.04-arm
            asset: suiseki-linux-arm64-musl
            container: alpine:3
          - name: windows-x64
            runner: windows-latest
            asset: suiseki-windows-x64.exe
    steps:
      - name: download binaries
        uses: actions/download-artifact@v4
        with:
          name: dist

      - name: smoke test
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
          CONTAINER: ${{ matrix.container }}
        run: |
          set -euo pipefail
          chmod +x "$ASSET" || true

          # Run the binary natively, or inside a musl container when set. -i so
          # the diff fixture can be piped to stdin in both cases.
          run() {
            if [ -n "${CONTAINER:-}" ]; then
              docker run --rm -i -v "$PWD:/w" -w /w "$CONTAINER" "./$ASSET" "$@"
            else
              "./$ASSET" "$@"
            fi
          }

          echo "--- --version ---"
          run --version | grep -q '^suiseki '

          echo "--- --help ---"
          run --help | grep -q 'Usage:'

          echo "--- stdin diff ---"
          printf 'diff --git a/x b/x\nindex 0000000..1111111 100644\n--- a/x\n+++ b/x\n@@ -1 +1 @@\n-old\n+new\n' \
            | run --no-pager --no-color | grep -q 'new'

          echo "ok: $ASSET"

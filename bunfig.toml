[install]
exact = false
[test]
root = "./src"

coverage = true
coverageDir = "coverage"
coverageReporter = ["text", "lcov"]
coverageSkipTestFiles = true
coverageThreshold = { lines = 0.8, functions = 0.8, statements = 0.8 }
# upgrade-io.ts is the network/filesystem adapter for `suiseki upgrade`; its
# logic is covered through the ReleaseClient port in upgrade-command.test.ts.
coveragePathIgnorePatterns = ["src/vendor/**", "src/upgrade-io.ts"]
